[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-clean-pipeline"
version = "1.0.0"
description = "Reproducible schema-driven CSV cleaning with audit artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
gamma-clean = "gamma_clean.__main__:cli"

[tool.setuptools.packages.find]
include = ["gamma_clean*"]
